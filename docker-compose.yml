services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tr7
      POSTGRES_PASSWORD: tr7
      POSTGRES_DB: tr7
    ports:
      - "5432:5432"
    volumes:
      - tr7_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tr7"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://tr7:tr7@postgres:5432/tr7
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  tr7_postgres_data:
